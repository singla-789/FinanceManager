spring.application.name=Finance_Manager

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3305/financeManager
spring.datasource.username=root
spring.datasource.password=Singla1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Session Cookie Configuration
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m

# Server Port (configurable via environment variable PORT for Render/Cloud)
server.port=${PORT:8080}
